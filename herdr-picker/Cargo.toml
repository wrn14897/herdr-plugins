[package]
name = "herdr-picker"
version = "0.1.0"
edition = "2024"
description = "Fuzzy-search herdr workspaces with a live preview of the active pane"
license = "MIT"
repository = "https://github.com/wrn14897/herdr-plugins"

[dependencies]
ansi-to-tui = "8.0.1"
anyhow = "1.0.104"
crossterm = "0.29"
nucleo-matcher = "0.3.1"
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
unicode-width = "0.2.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# A small application binary: terminal coordinates are tiny, so narrowing casts are safe.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
